name: Build, test and deploy

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.18.0
          runtime: node@24
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Lint
        run: bun run lint

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WebAssembly
        working-directory: calcu
        run: wasm-pack build --target web --out-dir pkg

      - name: Build Nuxt site
        run: bun run gen

      - name: Install Chromium
        run: bun run playwright install --with-deps chromium

      - name: Run tests
        run: |
          bun run dev > "$RUNNER_TEMP/nuxt-dev.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT

          for attempt in {1..120}; do
            if grep -q 'Ready in' "$RUNNER_TEMP/nuxt-dev.log"; then
              break
            fi
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/nuxt-dev.log"
              exit 1
            fi
            sleep 1
          done

          if ! grep -q 'Ready in' "$RUNNER_TEMP/nuxt-dev.log"; then
            cat "$RUNNER_TEMP/nuxt-dev.log"
            exit 1
          fi

          bun run vt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.output/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
